display_information:
  name: n0glemand
  description: n0glemand
  background_color: "#0a0a0a"
features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: n0glemand
    always_online: true
  slash_commands:
    - command: /n0glemand
      url: https://REPLACE-ME.example.com/slack/commands
      description: Interact with n0glemand (logs, help, ...)
      usage_hint: "logs [N] | help"
      should_escape: false
oauth_config:
  scopes:
    bot:
      - chat:write
      - files:write
      - channels:history
      - groups:history
      - im:history
      - channels:join
      - channels:read
      - app_mentions:read
settings:
  event_subscriptions:
    request_url: https://REPLACE-ME.example.com/slack/events
    bot_events:
      - message.channels
      - message.groups
      - message.im
      - channel_created
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
